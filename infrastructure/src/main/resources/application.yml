spring:
  application:
    name: stock-pilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockpilot}
    username: ${DB_USER:stockpilot}
    password: ${DB_PASSWORD:stockpilot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: stock-pilot
    description: Inventory and point of sale for small businesses
